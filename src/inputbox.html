<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chatbot Input</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .chatbox {
    width: 100%;
    max-width: 640px;
    background: #1a1a1a;
    border-radius: 18px;
    padding: 18px 18px 14px 18px;
  }

  .input-area {
    position: relative;
    margin-bottom: 14px;
    min-height: 48px;
  }

  #placeholder {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    transition: opacity 0.35s ease;
    user-select: none;
  }

  #chatInput {
    min-height: 48px;
    max-height: 140px;
    overflow-y: auto;
    outline: none;
    border: none;
    background: transparent;
    font-size: 15px;
    color: #90caf9;
    line-height: 1.5;
    caret-color: #90caf9;
    font-family: inherit;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: #2a2a2a; }

  .computer-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1.5px dashed #444;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .computer-chip:hover { border-color: #666; }
  .computer-chip span {
    font-size: 13px;
    color: #aaa;
  }

  .spacer { flex: 1; }

  .model-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 8px;
    background: transparent;
    border: none;
    transition: background 0.15s;
  }
  .model-btn:hover { background: #2a2a2a; }
  .model-btn span {
    font-size: 13px;
    color: #aaa;
  }

  .send-btn {
    background: #333;
    border: none;
    cursor: pointer;
    padding: 7px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    transition: background 0.15s;
  }
  .send-btn:hover { background: #444; }
</style>
</head>
<body>

<div class="chatbox">
  <div class="input-area">
    <div id="placeholder">Ask anything...</div>
    <div
      id="chatInput"
      contenteditable="true"
      spellcheck="false"
    ></div>
  </div>

  <div class="toolbar">
    <!-- Plus button -->
    <button class="icon-btn" title="Attach">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Computer chip -->
    <div class="computer-chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <span>Computer</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>

    <div class="spacer"></div>

    <!-- Model selector -->
    <button class="model-btn" title="Select Model">
      <span>Model</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        stroke="#888" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <!-- Mic button -->
    <button class="icon-btn" title="Voice Input">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <!-- Send button -->
    <button class="send-btn" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const placeholders = [
    "Ask anything...",
    "Type something...",
    "Ask your question...",
    "What's on your mind?",
    "How can I help you?",
    "Start a conversation..."
  ];

  let pIdx = 0;
  const ph = document.getElementById('placeholder');
  const inp = document.getElementById('chatInput');

  function updatePlaceholder() {
    ph.style.opacity = inp.innerText.trim().length > 0 ? '0' : '1';
  }

  inp.addEventListener('input', updatePlaceholder);

  function cyclePlaceholder() {
    ph.style.opacity = '0';
    setTimeout(() => {
      pIdx = (pIdx + 1) % placeholders.length;
      ph.textContent = placeholders[pIdx];
      if (inp.innerText.trim().length === 0) ph.style.opacity = '1';
    }, 350);
  }

  setInterval(cyclePlaceholder, 3000);

  inp.focus();
</script>
</body>
</html>
